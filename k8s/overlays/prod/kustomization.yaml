apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lwp

resources:
  - ../../base
  - secrets.yaml          # not committed — see secrets.yaml.example

images:
  - name: registry.example.com/lwp/backend
    newTag: "1.0.0"
  - name: registry.example.com/lwp/frontend
    newTag: "1.0.0"

patches:
  - path: nginx-config-patch.yaml
  # Set to your Nextcloud origin(s) if you're using the Nextcloud custom app
  # (nextcloud-app/nextdesk) to embed this instance — space-separated
  # https://... origins. Leave the value empty to disable embedding.
  - target:
      kind: Deployment
      name: nginx
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "https://cloud.example.com"
