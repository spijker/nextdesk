# LWP web terminal — system-wide tmux defaults (/etc/tmux.conf).
# Users can override anything here with their own ~/.tmux.conf — tmux reads
# /etc/tmux.conf first and the user's file second, so personal settings win
# (the home directory is persistent, drop a ~/.tmux.conf there and relaunch).

set -g history-limit 10000

# 24-bit colour pass-through — without it, apps designed for truecolor
# themes (opencode) get quantized to 256 colours and look off.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ttyd doesn't set SHELL — force a login bash (new panes/windows spawn it
# too), so profile.d (nvm/node PATH) is loaded.
set -g default-command "/bin/bash -l"

# Tab title follows the running command, falls back to the shell name.
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Mouse mode stays OFF (tmux's own default) — this is the whole reason tmux
# was safe to switch to: leaving it off means browser-native text selection
# and copy/paste in xterm.js keep working exactly like they did under
# screen. Do NOT `set -g mouse on`.

# Footer: "terminal:" + window tabs, current tab highlighted. No date/time.
#   terminal: 0 bash  1 vim
set -g status on
set -g status-position bottom
set -g status-style "bg=colour22,fg=colour255"
set -g status-left "#[bold]terminal:#[default] "
set -g status-left-length 16
set -g status-right ""
set -g window-status-format " #I #W "
set -g window-status-current-format "#[bold,bg=colour24] #I #W #[default]"
